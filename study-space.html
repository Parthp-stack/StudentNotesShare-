<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Study Space — StudyShare GPJ 2023–2026</title>
  <meta name="description" content="Immersive 3D & VR-inspired academic knowledge space for GPJ Diploma students. Explore subjects and notes in a 3D spatial network.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/3d.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="study-space-body">

  <!-- Fullscreen Three.js Canvas Container -->
  <div id="study-space-canvas-container"></div>

  <!-- Top Floating HUD -->
  <header class="space-top-hud">
    <!-- Brand / Back Link -->
    <div class="hud-glass-card">
      <a href="index.html" style="display: flex; align-items: center; gap: 0.6rem; color: #fff; font-weight: 700; font-family: var(--font-heading);">
        <i class="fas fa-atom" style="color: var(--brand-primary); font-size: 1.25rem;"></i>
        <span>StudyShare <span style="color: var(--brand-primary); font-size: 0.8rem;">3D Space</span></span>
      </a>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <a href="notes.html" class="btn btn-secondary btn-sm" style="background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15);">
        <i class="fas fa-compass"></i> Notes Explorer
      </a>
    </div>

    <!-- Controls Actions -->
    <div class="hud-glass-card">
      <!-- Ambient Audio Hum Toggle -->
      <button id="sound-toggle-btn" class="btn btn-outline btn-sm" title="Toggle Ambient Cyber Sound" style="border-radius: 50%; width: 2.25rem; height: 2.25rem; padding: 0;">
        <i class="fas fa-volume-mute"></i>
      </button>

      <!-- Reset Camera Focus -->
      <button id="reset-camera-btn" class="btn btn-outline btn-sm" title="Reset View to Origin" style="border-radius: 50%; width: 2.25rem; height: 2.25rem; padding: 0;">
        <i class="fas fa-crosshairs"></i>
      </button>

      <!-- Theme Switcher -->
      <button class="theme-toggle-btn" style="width: 2.25rem; height: 2.25rem; font-size: 0.9rem;" title="Toggle Theme">
        <i class="fas fa-sun"></i>
      </button>

      <!-- Exit Button -->
      <a href="index.html" class="btn btn-primary btn-sm" style="padding: 0.4rem 0.85rem;">
        <i class="fas fa-sign-out-alt"></i> Exit 3D
      </a>
    </div>
  </header>

  <!-- Node Inspection Drawer (Slides in from right when a node is clicked) -->
  <aside class="node-inspector-drawer" id="node-inspector-drawer">
    <button class="drawer-close-btn" id="close-drawer-btn" title="Close Inspector" aria-label="Close Inspector">
      <i class="fas fa-times"></i>
    </button>

    <div style="margin-top: 0.5rem;">
      <span id="inspector-sem-badge" class="inspector-sem-badge badge-co3k">CO3K</span>
      <h2 id="inspector-title" class="inspector-node-title">Database Management System</h2>
      <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1rem;">
        Academic curriculum node for GPJ 2023–2026. View available study materials, exam revision sets, and student notes.
      </p>
    </div>

    <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 1rem;">
      <h4 style="font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin-bottom: 0.75rem;">
        Available Materials
      </h4>
      <div class="inspector-notes-list" id="inspector-notes-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div style="margin-top: auto; padding-top: 1.25rem;">
      <a id="inspector-explorer-link" href="notes.html" class="btn btn-primary btn-sm" style="width: 100%;">
        <i class="fas fa-external-link-alt"></i> View All in Explorer
      </a>
    </div>
  </aside>

  <!-- Instructions Overlay Pill -->
  <div class="space-instructions-pill">
    <i class="fas fa-info-circle" style="color: var(--brand-primary);"></i>
    <span>Click any node to inspect • Drag to rotate • Scroll to zoom</span>
  </div>

  <!-- Bottom Semester Quick-Glide Filter Bar -->
  <nav class="space-semester-filter">
    <button class="space-sem-btn active" data-semester="ALL">All Hub Nodes</button>
    <button class="space-sem-btn" data-semester="CO3K">CO3K (3rd)</button>
    <button class="space-sem-btn" data-semester="CO4K">CO4K (4th)</button>
    <button class="space-sem-btn" data-semester="CO5K">CO5K (5th)</button>
    <button class="space-sem-btn" data-semester="CO6K">CO6K (6th)</button>
  </nav>

  <!-- Supabase Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Three.js & OrbitControls CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Application Modules -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/study-space.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.StudySpace.init();
    });
  </script>
</body>
</html>
