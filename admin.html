<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access — Admin Only</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #111827;
        }

        .message {
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .message h1 {
            font-size: 50px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .message p {
            font-size: 20px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 22px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: #38bdf8;
        }

        @media (max-width: 480px) {
            .message {
                padding: 1.25rem;
            }
            .message h1 {
                font-size: 34px;
            }
            .message p {
                font-size: 16px;
            }
            .back-btn {
                display: block;
                width: 100%;
                box-sizing: border-box;
                padding: 12px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="message">
        <h1>Sorry!</h1>
        <p>You cannot access this page.</p>
        <a href="index.html" class="back-btn">&larr; Return to StudyShare</a>
    </div>

</body>
</html>
