<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access — Admin Only</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #111827;
        }

        .message {
            text-align: center;
            color: white;
            padding: 2rem;
        }

        .message h1 {
            font-size: 50px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .message p {
            font-size: 20px;
            color: #9ca3af;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 10px 22px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(56, 189, 248, 0.12);
            border-color: #38bdf8;
        }

        @media (max-width: 480px) {
            .message {
                padding: 1.25rem;
            }
            .message h1 {
                font-size: 34px;
            }
            .message p {
                font-size: 16px;
            }
            .back-btn {
                display: block;
                width: 100%;
                box-sizing: border-box;
                padding: 12px 18px;
            }
        }
    </style>
</head>

<body>

    <div class="message" id="admin-restricted-box">
        <h1>Sorry!</h1>
        <p>You cannot access this page.</p>
        
        <div style="margin: 25px auto; max-width: 340px;">
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                <input type="password" id="admin-pass-input" placeholder="Admin Password" style="padding: 10px 14px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 14px; width: 180px; text-align: center;">
                <button type="button" id="admin-unlock-btn" style="padding: 10px 18px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: 700; cursor: pointer;">Unlock</button>
            </div>
            <div id="admin-msg-box" style="display: none; color: #ef4444; font-weight: 700; font-size: 13px; margin-top: 12px; background: rgba(239, 68, 68, 0.12); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(239, 68, 68, 0.3);"></div>
        </div>

        <a href="index.html" class="back-btn">&larr; Return to StudyShare</a>
    </div>

    <!-- Admin Panel (Revealed only with valid password) -->
    <div class="message" id="admin-panel-box" style="display: none; max-width: 500px; text-align: left;">
        <h2 style="font-size: 24px; color: #38bdf8; margin-bottom: 15px;">Supabase Settings (Admin)</h2>
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 4px;">Project URL (SUPABASE_URL)</label>
            <input type="text" id="admin-sb-url" style="width: 100%; box-sizing: border-box; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; color: #94a3b8; display: block; margin-bottom: 4px;">Publishable Key (SUPABASE_PUBLISHABLE_KEY)</label>
            <textarea id="admin-sb-key" rows="3" style="width: 100%; box-sizing: border-box; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-family: monospace; font-size: 12px;"></textarea>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button type="button" id="admin-sb-clear" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">Clear Override</button>
            <button type="button" id="admin-sb-save" style="background: #10b981; color: #fff; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 13px;">Save & Apply</button>
        </div>
    </div>

    <!-- Supabase Client & Config -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script>
        const ADMIN_PASS = '@Xyz12345';
        const unlockBtn = document.getElementById('admin-unlock-btn');
        const passInput = document.getElementById('admin-pass-input');
        const msgBox = document.getElementById('admin-msg-box');
        const restrictedBox = document.getElementById('admin-restricted-box');
        const panelBox = document.getElementById('admin-panel-box');
        const sbUrlInput = document.getElementById('admin-sb-url');
        const sbKeyInput = document.getElementById('admin-sb-key');
        const sbSaveBtn = document.getElementById('admin-sb-save');
        const sbClearBtn = document.getElementById('admin-sb-clear');

        function tryUnlock() {
            const entered = passInput.value.trim();
            if (entered === ADMIN_PASS) {
                restrictedBox.style.display = 'none';
                panelBox.style.display = 'block';
                const active = window.StudyShareDB ? window.StudyShareDB.getActiveConfig() : {};
                if (sbUrlInput) sbUrlInput.value = active.url || '';
                if (sbKeyInput) sbKeyInput.value = active.anonKey || '';
            } else {
                msgBox.textContent = 'dont try password is set by admin good luck';
                msgBox.style.display = 'block';
                if (window.StudyShareDB && window.StudyShareDB.recordSecurityEvent) {
                    window.StudyShareDB.recordSecurityEvent('UNAUTHORIZED_ADMIN_ATTEMPT', {
                        details: 'Wrong password on admin.html'
                    });
                }
            }
        }

        if (unlockBtn) unlockBtn.addEventListener('click', tryUnlock);
        if (passInput) passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') tryUnlock();
        });

        if (sbSaveBtn) {
            sbSaveBtn.addEventListener('click', () => {
                const url = sbUrlInput.value.trim();
                const anonKey = sbKeyInput.value.trim();
                if (!url || !anonKey) {
                    alert('Please enter both URL and publishable key.');
                    return;
                }
                window.StudyShareDB.saveConfigOverride({ url, anonKey });
            });
        }

        if (sbClearBtn) {
            sbClearBtn.addEventListener('click', () => {
                window.StudyShareDB.clearConfigOverride();
            });
        }
    </script>

</body>
</html>
